<body>
    <!-- Internal JavaScript -->
    <script>
        // In ra màn hình: document.writeln
        document.writeln("Hello World! <br>");

        // Khai báo biến dùng: var
        var name = "Phương Ngân <br>"
        document.writeln(name);

        ten = "Hương Ly <br>"
        document.writeln(ten);

        // Số thì không cần dấu nháy đôi
        var namNay = 2026;
        document.writeln(namNay);

        // Phép toán: cộng, trừ, nhân, chia, chia lấy dư
        var soThuNhat = 16;
        var soThuHai = 10;
        var ketQua = 0
        //Cộng:
        document.writeln("<br> Kết quả số thứ 1 + số thứ 2:");
        ketQua = soThuNhat + soThuHai;
        document.write(ketQua);

         //Trừ:
        document.writeln("<br> Kết quả số thứ 1 - số thứ 2:");
        ketQua = soThuNhat - soThuHai;
        document.write(ketQua);

         //Nhân:
        document.writeln("<br> Kết quả số thứ 1 * số thứ 2:");
        ketQua = soThuNhat * soThuHai;
        document.write(ketQua);

         //Chia:
        document.writeln("<br> Kết quả số thứ 1 / số thứ 2:");
        ketQua = soThuNhat / soThuHai;
        document.write(ketQua);

        //Chia lấy dư: %
        document.writeln("<br> Kết quả số thứ 1 % số thứ 2:");
        ketQua = soThuNhat % soThuHai;
        document.write(ketQua);

        //++: tăng thêm 1 đơn vị (phụ thuộc vào vị trí đặt dấu)
        document.writeln("<br>");
        document.write(soThuNhat++);

        document.writeln("<br>");
        document.write(++soThuNhat);

        //--: giảm 1 đơn vị
        document.writeln("<br>");
        document.write(--soThuNhat);

        //+=: sothunhat= sothunhat + sothuhai
        soThuNhat += soThuHai;
        document.writeln("<br>");
        document.writeln(soThuNhat);

        //-=: sothunhat= sothunhat - sothuhai
        soThuNhat -= soThuHai;
        document.writeln("<br>");
        document.writeln(soThuNhat);

        //Ghép chuỗi: + (nối các chuỗi lại với nhau)
        var ho = "Nguyễn";
        document.writeln("<br>");
        document.writeln(ho + " " + name);

        //Chiều dài chuỗi: length
        document.writeln(ho.length);

        //Kiểm tra kiểu của biến: typeof
        document.writeln(typeof(ho));

        //Tìm vị trí (kết quả trả về kiểu số): indexOf
        var hoVaTen = "Nguyễn Phương Ngân";
        document.writeln("<br>");
        document.writeln(hoVaTen.indexOf("P"));

        //Tìm xem trong mảng có kí tự đấy không (kết quả trả về dạng true/false): includes
        document.writeln("<br>");
        document.writeln(hoVaTen.includes("P"));

        document.writeln("<br>");
        document.writeln(hoVaTen.includes("E"));


        //Kiểm tra chuỗi có bắt đầu như nào (kết quả trả về dạng true/false): startsWith
        document.writeln("<br>");
        document.writeln(hoVaTen.startsWith("Nguyễn"));

        document.writeln("<br>");
        document.writeln(hoVaTen.startsWith("Phương"));

        //Tìm kiếm và thay thế 1 chuỗi mới: replace
        document.writeln("<br>");
        document.writeln(hoVaTen.replace("Nguyễn","Trần"));

        //In hoa: toUpperCase
        document.writeln("<br>");
        document.writeln(hoVaTen.toUpperCase());

        //In thường: toLocaleLowerCase
        document.writeln("<br>");
        document.writeln(hoVaTen.toLocaleLowerCase());



        //BUỔI 2:
        //DATE
        var homNay = new Date();
        document.writeln("<br>");
        document.write(homNay);

        var ngay = new Date("9/30/2026");
        document.writeln("<br>");
        document.write(ngay);

        var namNay = homNay.getFullYear();
        document.writeln("<br>");
        document.write(namNay);

        //Tháng luôn chậm đi 1 đơn vị: 0 là tháng 1,...
        var thangNay = homNay.getMonth();
        document.writeln("<br>");
        document.write(thangNay);

        var ngayNay = homNay.getDate();
        document.writeln("<br>");
        document.write(ngayNay);

        //Thứ chậm hơn 1 đơn vị: 1 là thứ 2,...
        var thuNay = homNay.getDay();
        document.writeln("<br>");
        document.write(thuNay);

        var ngayHomNay = homNay.getDate();
        var thu = homNay.getDay()+1;
        document.writeln("<br>");
        document.write("Hôm nay là thứ " + thu + " ngày " + ngayHomNay + " tháng " + thangNay + " năm " + namNay);


        //MẢNG
        var mangSo = [1,2,3,4,5];
        document.writeln("<br>");
        //Thứ tự của phần tử
        document.writeln(mangSo[2]);
        document.writeln("<br>");
        //Độ dài của mảng: length
        document.writeln(mangSo.length);

        document.writeln("<br>");
        var mangTen = ["Ngan", "Ly", "Hong"];
        document.write(mangTen[2]);

        document.writeln("<br>");
        var mang = [1,2,3,4,5, "Ngan", "Ly", "Hong"];
        document.write(mang[5]);

        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        //Join: thêm dấu gạch giữa vào các phần tử trong mảng
        document.write(d.join("-"));

        document.writeln("<br>");
        //Pop: lấy phần tử cuối cùng ở trong mảng
        document.write(d.pop());

        document.writeln("<br>");
        //Push: Thêm phần tử vào mảng
        d.push("qanh");
        document.write(d);

        document.writeln("<br>");
        //Reverse: Đảo ngược phần tử trong mảng lại
        document.write(mangSo.reverse());

        
        //OBJECT

        document.writeln("<br>");
        //Khai báo phần tử nào thì lấy ptu đó
        document.write(thongTinSinhVien.queQuan.tinh);

        document.writeln("<br>");
        //Tính tuổi sinh viên:
        tuoi = namNay - thongTinSinhVien.namSinh;
        thongTinSinhVien.tuoi = tuoi;
         document.write(tuoi);
        //console.log(thongTinSinhVien);

        //boolean: true nam / false nữ
        var thongTinSinhVien = {
            gioiTinh: false
        }
        thongTinSinhVien.gioiTinh = true;
        var danhSach = [
          {
            ten: "Nguyen Phuong Ngan",

          {

                xa: "Hung Phu"
            }
          }
        ];
        console.log(danhSach);

        //==, !=, ><
        var so1 = 10; //số 10
        var so2 = "10"; //chuỗi 10
        document.writeln("<br>");
        document.writeln(so1 == so2);


        document.writeln("<br>");
        if(thu>6){
            document.writeln("Cuối tuần");
        }else if(thu == 6){
            document.writeln("Sắp được nghỉ học")
        }else{
            document.writeln("Đi học");
        }

        document.writeln("<br>");
        var so = 5;
        //Kiểm tra số chẵn lẻ
        if(so %2 == 0){
            document.writeln(so+ " là số chẵn");
        }
        else{
            document.writeln(so+ " là số lẻ");
        }

        //Btvn: var so = 200000001, 1 số quá lớn thì in ra thế nào
        //Có in ra được như bình thường, số lớn hơn 9ty có thể in, nhưng có thể sai hoặc bị làm tròn
        document.writeln("<br>");
        var so = 20000000001;
        if(so %2 == 0){
            document.writeln(so+ " là số chẵn");
        }
        else{
            document.writeln(so+ " là số lẻ");
        }
        //Giải pháp nếu số quá lớn:
        var so = "20000000000000000000009";
        var doDai = so.length;
        var soCuoiCung = so[doDai-1];
        document.writeln("<br>");
        document.writeln(soCuoiCung);
        document.writeln("<br>");
        if(soCuoiCung %2 == 0){
            document.writeln(so+ " là số chẵn");
        }
        else{
            document.writeln(so+ " là số lẻ");
        }



        //BUỔI 3:
        //SWITCH CASE:
        document.writeln("<br>");
        var d = new Date();
        var theDay = d.getDay();
        switch (theDay){
            case 5:
                document.write("Finally Friday");
                break;
            case 6:
                 document.write("Super Saturday");
                 break;
            case 0:
                 document.write("Sleepy Sunday");
                 break;
            default:
                 document.write("I'm looking forward to this weekend!");
        }

    
        //Vòng lặp FOR:
        for (var index = 1; index <= 10; index++){
            document.writeln("<br>");
            document.writeln("thèm gà rán " + index);
        }
        //Mảng:
        //var mang = [1,2,3,4,5, "Ngan", "Ly", "Hong"];
        for (var i = 0; i< mang.length; i++){
            document.writeln("<br>");
            document.writeln(mang[i]);
        }
        //Ví dụ 1:
        for (var i = 0; i< mang.length; i++){
            if(isNaN(mang[i])){
                document.writeln("<br>");
                document.writeln("xin chào  " + mang[i]);
            }
        }

        
        //WHITE: kiểm tra đầu(đếm tiền trước khi mua)
        var i = 0;
        while (i<=10){
            document.writeln("<br>");
            document.writeln("The number is  " + i);
            i = i+1;
        }
        //DO WHILE: kiểm tra sau(ăn rồi mới hỏi=)))))))
        var j = 0;
        do{
            document.writeln("<br>");
            document.writeln("The number is  " + j);
            j = j+1;
        }
        while (j <= 10)


        //POPUP BOXES: 
        //alert: hiển thị nội dung thông báo lên
        alert("hello");

        //cofirm: hiện thị ra 2 trường hợp 
        document.writeln("<br>");
        var r = confirm("Press a button")
        if (r==true){
            document.write("You pressed OK!");
        }
        else{
            document.write("You pressed Cancel!");
        }

        //prompt: nhập thông tin
        var r =  prompt("Nhập vào họ tên", "Nhập tên ở đây");
        document.write(r);



    </script>
