<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
        }

        .danh-sach-muc{
            padding: 0;
            margin: 0;
            /* list-style: none; để bỏ dấu chấm tròn ở danh sách khi dùng ul, il */
            list-style: none;
            /* Display: flex; để các thư mục nằm trên cùng 1 dòng */
            display: flex;
            /* Gap là khoảng cách các thư mục (tách các chữ) */
            gap: 20px;
        }

        .danh-muc{
            background-color: #198cf0;
            padding: 10px;
        }
        .lien-ket{
            color: white;
            /* Text-decoration: none; là để bỏ đi gạch chân của thẻ a */
            text-decoration: none;
        }


        main{
            /* Display: flex; để các khối chia đều, nằm trên cùng 1 dòng */
            display: flex;
        }

        .trai{
            width: 20%;
            height: 100vh;
            border: 1px solid #198cf0;
        }

        .khoi-dang-nhap{
            width: 100%;
            height: 100px;
        }

        form{
            width: 80%;
            margin: 10px auto;
        }

        .khoi-thong-tin{
            width: 100%;
            margin: 10px auto;
        }

        p{
            margin: 0;
        }

        input{
            width: 100%;
            padding: 5px 0;
            border-radius: 5px;
        }

        .quen-mat-khau{
            display: flex;
            justify-content: flex-end;
        }

        .quen-mat-khau-lien-ket{
            color: #198cf0;
            text-decoration: none;
        }

        button{
            width: 100%;
            padding: 5px 0;
        }

        .login{
            margin-bottom: 10px;
        }

        .login-365{
            width: 100%;
        }

        .phai{
            width: 80%;
            /* Border: tạo đường viền  */
            /* 3 tham số tương ứng: độ dày, kiểu đường viền, màu sắc */
        }

        .tin{
            width: 95%;
            height: 100px;
            margin: 20px auto;
            border: 1px solid #198cf0;
            border-radius: 10px;
        }

        .chuc-nang{
            width: 95%;
            margin: 5px auto;
            padding: 5px;
            display: flex;
            justify-content: space-between;
        }


    </style>
</head>
<body>
    <!-- Danh mục -->
     <nav class="danh-muc">
        <ul class="danh-sach-muc">
            <li class="muc"><a href="#" class="lien-ket">Thực tập, Đồ án</a></li>
            <li class="muc"><a href="#" class="lien-ket">Thủ tục Một Cửa</a></li>
            <li class="muc"><a href="#" class="lien-ket">Một Cửa Online</a></li>
            <li class="muc"><a href="#" class="lien-ket">E-mail HUMG</a></li>
        </ul>
     </nav>

     <main>
        <div class="trai">
            <div class="khoi-dang-nhap">
                <form action="">
                    <div class="khoi-thong-tin">
                        <p>Tài khoản</p>
                        <input type="text" name="" id="">
                    </div>
                    <div class="khoi-thong-tin">
                        <p>Mật khẩu</p>
                        <input type="password" name="" id="">
                    </div>
                    <div class="quen-mat-khau">
                        <a class="quen-mat-khau-lien-ket" href="">Quên mật khẩu?</a>
                    </div>
                    <div class="khoi-thong-tin">
                        <button class="login">Đăng nhập</button>
                        <button class="login-365">Đăng nhập với Microsoft</button>
                    </div>
                </form>
            </div>

        </div>
        <div class="phai">
            <div class="danh-sach-tin">
                <div class="tin"> 
                    <div class="chuc-nang">
                        <div class="tieu-de">Tin tức</div>
                        <div class="xem-tiep">Xem tiếp</div>
                    </div>
                </div>
            </div>
        </div>
     </main>
</body>
</html>
