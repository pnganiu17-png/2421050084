<html>
    <head>
       <title>bai 1 html</title> 
    </head>
    <body>
        Môn phát triển ứng dụng web + BTL

        <!-- để chú thích dùng 2 cách
         cách 1: ctrl + k + c
         cách 2: ctrl + /
         Đây là chú thích-->

         <p> Thẻ P là thẻ phân đoạn</p>

         <!-- Thẻ h1, h2, h3 cỡ chữ to đến nhỏ-->
         <h1> Thẻ H1</h1>
         <h2> Thẻ H2</h2>
         <h3> Thẻ H3</h3>

         <!-- Thẻ br để xuống dòng-->
         <p> Môn web <br> Nhóm 03</p>

         <!-- Thẻ div và span để phân chia đoạn  -->
         <div> Đây là thẻ div</div>
         <span> Đây là thẻ span</span>

         <!-- Thẻ b: chữ đậm
              Thẻ i: chữ nghiêng
              Thẻ u: gạch chân -->
          <b> Thẻ b</b> <br>
          <i> Thẻ i</i> <br>
          <u> Thẻ u</u> <br>

          <div> 
            <font face="verdana">Môn phát triển ứng dụng web</font>
            <font color="pink">Nhóm 03</font>
            <font size="10">Tiết 1 2</font>
            <br>
            <font face="arial">Nguyễn Phương Ngân</font>
            <font color="green">Phương Ngân</font>
            <font size="15"> Phương Ngân</font>
            <br>
            <font face="arial" color="green" size="15">Phương Ngân</font>
          </div>
    </body>
    
</html>
