        //element by: trỏ đế hàm bên trên muốn trỏ
        //lấy được thông tin, dưới có hàm tính điểm r làm thê nào để in ra điểm
        function tinhDiem(){
            var a = parseFloat(document.getElementById("diemA").value);
            var b = parseFloat(document.getElementById("diemB").value);
            var c = parseFloat(document.getElementById("diemC").value);

            // document.write("Điểm A nhập vào là: " + a);
            // document.write("<br>"+ "Điểm B nhập vào là: " + b);
            // document.write("<br>"+ "Điểm C nhập vào là: " + c);

            document.getElementById("ketQua").value = tinhDiemChu(a,b,c);
        }

        //BTVN: Viết hàm tính điểm dựa trên 3 đầu điểm (A, B, C)
        //tong = A*0,6 + B*O,3+ C*0,1 => điểm chữ tương ứng
        document.writeln("<br>");
        function tinhDiemChu(a,b,c){
            if (isNaN(a) == false && isNaN(b) == false && isNaN(c)== false){
                var tongDiem = a*0.6 + b*0.3 + c*0.1;
                var ketQua = "";
                //document.write("Tổng điểm là: "+ tongDiem + "<br>");

                if (tongDiem >= 9.0){
                    ketQua = "A+";
                    //document.writeln("Điểm A+");
                }
                else if(tongDiem >= 8.5){
                    ketQua = "A";
                    //document.writeln("Điểm A");
                }
                else if(tongDiem >= 8.0){
                    ketQua = "B+";
                    //document.writeln("Điểm B+");
                }
                else if(tongDiem >= 7.0){
                    ketQua = "B";
                    //document.writeln("Điểm B");
                }
                else if(tongDiem >= 6.5){
                    ketQua = "C+";
                    //document.writeln("Điểm C+");
                }
                else if(tongDiem >= 5.5){
                    ketQua = "C";
                    //document.writeln("Điểm C");
                }
                else if(tongDiem >= 5.0){
                    ketQua = "D+";
                    //document.writeln("Điểm D+");
                }
                else if(tongDiem >= 4.0){
                    ketQua = "D";
                    //document.writeln("Điểm D");
                }
                else {
                    ketQua = "F";
                    //document.writeln("Điểm F");
                }
                return ketQua;
            }
        }
