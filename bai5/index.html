<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 5</title>
    <!-- Link liên kết loại 3 với index -->
     <!-- Loại 3: -->
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        /* Loại 2: Internal style: viết bên ngoài thẻ */
        h2{
            /* Color dùng để quy định màu chữ */
            color: red;
        }

        #tieuDe{
            color: pink;
        }
    </style>
</head>
<body>

    <!-- I.Các kiểu viết style -->
    <!-- Kiểu 1: Viết style trong thẻ -->
    <!-- Loại 1: Inline style: viết trực tiếp trong thẻ -->
    <h1 style="color: blue">HUMG</h1>

    <!-- Kiểu 2: Viết ngoài thẻ( viết thẻ style bên trên)  -->
    <h2>Trường đại học Mỏ Địa Chất</h2>

    <!-- Ghi chú trong CSS là /*...*/ -->

    <!-- Loại 3: Tạo 1 file mới nằm ngoài, thẻ link liên kết -->
    <h3>Lớp phát triển môn Web 03</h3>


    <!-- II.Selecter là tên thẻ -->
    <!-- Cách 1: Dùng tên thẻ -->

    <!-- Cách 2: Dùng id( viết dấu # trước tên class) -->
    <h2 id="tieuDe">Trường đại học Mỏ Địa Chất</h2>

    <!-- Cách 3: Dùng class( viết dấu . trước tên class)-->
    <h1 id="tieuDe" class="tieuDe">Trường đại học Mỏ Địa Chất</h1>

    <h3 class="tieuDe2">Lớp phát triển môn Web 03</h3>
</body>
</html>
