<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        body{
            background-color: #2F2C38;
            color: white;
        }

        .danh-sach-muc{
            list-style: none;
            display: flex;
            gap: 20px;
            align-item: center;
        }

        .lien-ket{
            text-decoration: none;
            color: #DBDBDD;
            font-weight: bold;
        }

        .lien-ket-danh-muc{
            text-decoration: none;
            color: #DBDBDD;
            font-weight: bold;
            background-color: gray;
            border-radius: 15px;
            padding: 7px;
        }

        header{
            display:flex;
            justify-content: space-between;
            align-items: center;
        }

        .muc{
            padding: 15px;
            border-radius: 25px;
        }

        .muc:hover{
            background-color: gray;
        }

        .logo{
            /* width: 20%; */
            width: 5%;
        }

        .avata{
            width: 30px;
            height: 30px;
            border-radius:15px;
            object-fit: cover;
            margin: 20px;
            padding: 10px;
        }

        .dang-chon{
            background-color: #4E4B52;
            padding: 15px;
            border-radius: 25px;
        }
        
        .banner{
            /* background-color: aliceblue; */
            width: 95%;
            /* height: 40vh; */
            margin: 20px auto;
            border-radius: 20px;
        }

        .tieu-de-banner{
            width: 100%;
            display: flex;

        }

        .menu{
            list-style:none;
        }

        .danh-sach-the-loai{
            width: 95%;
            /* background-color: red; */
            height: 20vh;
            margin: 20px auto;
        }

        .phim{
            display: flex;
            justify-content: space-between;
        }

        .phim-poster{
            width: 24%;
            height: 20vh;
            border-radius: 15px;
            background-color: white;
            /* hình căn đúng tỉ lệ đep */
            object-fit: cover;
        }

        .danh-sach-nhan-vat{
            display: flex;
            justify-content: space-between;
        }

        .nhan-vat{
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
        }

        .banner-anh{
            width: 100%;
            height: 500px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

     </nav>

            </div>

            <div class="the-loai">
                <div class="ten-the-loai">
                   <h2>Hoạt hình</h2>

    <!-- Chân trang -->
    <footer>
    </footer>
    <script>
        var phim=[
            {
                id: 1,
                ten: "Zootopia",
                thoiLuong: 10,
                banner: "../netflix/i1.jpg",
                trailer: "https://www.youtube.com/embed/2WkyaCFIG3Y?si=XZg6rwHZy0B4zYXv"
            },
            {
                id: 2,
                ten: "Ponyo",
                thoiLuong: 10,
                banner: "../netflix/i2.jpg",
                trailer: "https://www.youtube.com/embed/X-HOMBJcTaw?si=b2BfHCzsZKEeZ1D_" 
            },
            {
             id: 3,
                ten: "Những chú cừu thông minh",
                thoiLuong: 10,
                banner: "../netflix/i3.jpg",
                trailer: "https://www.youtube.com/embed/RE_AhUD2Bsw?si=bFt_KgpiqRfu7B9n" 
            }

        ];

        var phimDangChon = phim[0];
        var banner = document.getElementsByClassName("banner-anh")[0];
        var trailer = document.getElementsByClassName("banner-anh")[1];

        function xemTrailer(){
            //Ẩn banner đi
            document.getElementsByClassName("banner")[0].style="display:none";
            //Hiển thị trailer lên
            document.getElementsByClassName("banner")[1].style="display:block";
        }

        function chonPhim(id){
            for (var i=0; i<phim.length; i++){
                if(phim[i].id==id){
                    banner.src=phim[i].banner;
                    trailer.src=phim[i].trailer;
                    banner.style="display: none";
                    trailer.style="display: block";
                }
            }
        }
    </script>
